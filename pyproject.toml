[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-02-annotation-action-policy"
version = "0.1.0"
description = "Cost-aware annotation-action research under expert disagreement"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "Pillow", "matplotlib", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]
